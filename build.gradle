import uk.gov.hmrc.components.buildsrc.Kotlin
import uk.gov.hmrc.components.buildsrc.Gradle

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    ext {
        compose_version = '2.1.10'
        kotlin_version = Kotlin.version
        navigation_safe_args = '2.9.8'
        agp_version = Gradle.version
    }
    repositories {
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url = uri("https://maven.pkg.github.com/hmrc/mobile-gradle-plugins")
            credentials {
                username = System.getenv("GITHUB_USER_NAME")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_safe_args"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
        classpath "uk.gov.hmrc.gradle:spotless:1.1.1"
        classpath 'com.karumi:shot:6.1.0'
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlin_version}"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'io.gitlab.arturbosch.detekt' version '1.18.1'
    id "org.jetbrains.kotlin.android" version "$kotlin_version" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version" apply false
    id "org.jetbrains.kotlin.kapt" version "$kotlin_version" apply false
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
}

allprojects {
    repositories {
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
}

subprojects {
    tasks.withType(Javadoc).all { enabled = false }
    group = 'uk.gov.hmrc.components'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
